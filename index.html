<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PilzMap 2.0</title>

<meta name="theme-color" content="#07110d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Inter, Arial, sans-serif;
    background: #07110d;
    color: #f8fafc;
}

#map {
    position: fixed;
    inset: 0;
    z-index: 1;
}

/* ---------------- TOP BAR ---------------- */

.topbar {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 14px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;

    background: rgba(7,17,13,.88);
    backdrop-filter: blur(18px);
    box-shadow: 0 12px 35px rgba(0,0,0,.45);
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 17px;
    font-weight: 800;
    color: #6ee7a0;
}

.logo span {
    font-size: 25px;
}

.top-actions {
    display: flex;
    gap: 6px;
}

.icon-btn {
    width: 38px;
    height: 38px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 11px;

    background: rgba(255,255,255,.07);
    color: white;

    font-size: 17px;
    cursor: pointer;
}

/* ---------------- BOTTOM SHEET ---------------- */

.sheet {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 10px;

    z-index: 1000;

    max-height: 72vh;
    overflow-y: auto;

    padding: 12px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 23px;

    background: rgba(7,17,13,.94);
    backdrop-filter: blur(22px);

    box-shadow: 0 -10px 45px rgba(0,0,0,.55);

    transition: .25s ease;
}

.sheet.collapsed {
    max-height: 82px;
    overflow: hidden;
}

.handle {
    width: 42px;
    height: 4px;
    margin: 0 auto 10px;

    border-radius: 10px;
    background: rgba(255,255,255,.25);
}

.sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.sheet-title {
    font-size: 15px;
    font-weight: 800;
}

.status {
    font-size: 11px;
    color: #94a3b8;
}

/* ---------------- DASHBOARD ---------------- */

.dashboard {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
    margin-bottom: 9px;
}

.stat {
    padding: 9px 5px;
    text-align: center;

    border-radius: 12px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.07);
}

.stat-number {
    display: block;
    color: #6ee7a0;
    font-size: 17px;
    font-weight: 800;
}

.stat-label {
    font-size: 9px;
    color: #94a3b8;
}

/* ---------------- SEARCH ---------------- */

.search {
    display: flex;
    gap: 7px;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    min-width: 0;

    padding: 12px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;

    background: rgba(255,255,255,.07);
    color: white;

    outline: none;
}

input::placeholder {
    color: #64748b;
}

input:focus,
select:focus {
    border-color: #34d399;
}

select option {
    background: #0f172a;
}

/* ---------------- BUTTONS ---------------- */

button {
    font-family: inherit;
}

.btn {
    width: 100%;

    padding: 11px 12px;
    margin-bottom: 7px;

    border: 0;
    border-radius: 12px;

    font-size: 12px;
    font-weight: 700;

    color: white;
    cursor: pointer;
}

.btn:active {
    transform: scale(.98);
}

.green {
    background: #059669;
}

.blue {
    background: #0284c7;
}

.orange {
    background: #d97706;
}

.purple {
    background: #7c3aed;
}

.teal {
    background: #0d9488;
}

.red {
    background: #dc2626;
}

.gray {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
}

.row {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 7px;
}

/* ---------------- SEASON ---------------- */

.season {
    padding: 10px;

    margin-bottom: 8px;

    border-radius: 12px;

    background: rgba(16,185,129,.09);
    border: 1px solid rgba(52,211,153,.18);

    font-size: 11px;
    color: #86efac;
}

/* ---------------- PILZ CARD ---------------- */

.pilz-card {
    display: none;

    margin-top: 8px;
    padding: 12px;

    border-radius: 14px;

    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
}

.pilz-card h3 {
    margin: 0 0 8px;
    font-size: 15px;
}

.info-line {
    display: flex;
    gap: 7px;

    margin: 6px 0;

    font-size: 11px;
    line-height: 1.4;
}

.tag {
    flex-shrink: 0;

    padding: 3px 6px;

    border-radius: 6px;

    background: rgba(52,211,153,.15);
    color: #6ee7a0;

    font-size: 9px;
    font-weight: 800;
}

/* ---------------- SAVED SPOTS ---------------- */

.spots {
    margin-top: 8px;
}

.spots-header {
    display: flex;
    justify-content: space-between;

    padding: 10px;

    border-radius: 12px;

    background: rgba(255,255,255,.05);

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.spot-list {
    display: flex;
    flex-direction: column;
    gap: 6px;

    max-height: 170px;
    overflow-y: auto;

    margin-top: 6px;
}

.spot {
    padding: 9px;

    border-radius: 11px;

    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.07);
}

.spot-title {
    font-size: 12px;
    font-weight: 700;
}

.spot-sub {
    margin-top: 3px;

    font-size: 10px;
    color: #94a3b8;
}

.spot-actions {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 5px;

    margin-top: 7px;
}

.mini {
    padding: 6px 3px;

    border: 0;
    border-radius: 7px;

    background: rgba(255,255,255,.07);
    color: #cbd5e1;

    font-size: 10px;
    cursor: pointer;
}

/* ---------------- MODAL ---------------- */

.modal {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 3000;

    padding: 20px;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.82);
    backdrop-filter: blur(12px);
}

.modal-box {
    width: 100%;
    max-width: 420px;

    padding: 18px;

    border-radius: 20px;

    background: #0b1711;
    border: 1px solid rgba(255,255,255,.12);
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-head h2 {
    margin: 0;
    font-size: 17px;
}

.close {
    font-size: 24px;
    color: #94a3b8;
    cursor: pointer;
}

.preview {
    margin-top: 12px;
    text-align: center;
}

.preview img {
    max-width: 100%;
    max-height: 240px;
    border-radius: 13px;
}

.warning {
    margin-top: 12px;
    padding: 10px;

    border-radius: 10px;

    background: rgba(239,68,68,.12);
    border: 1px solid rgba(239,68,68,.25);

    color: #fca5a5;

    font-size: 10px;
    line-height: 1.4;
}

/* ---------------- MAP CONTROLS ---------------- */

.map-control {
    position: fixed;
    z-index: 1001;

    right: 15px;
    top: 75px;

    padding: 10px 12px;

    border-radius: 12px;

    background: rgba(7,17,13,.9);
    border: 1px solid rgba(255,255,255,.12);

    color: white;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

/* Leaflet */

.leaflet-popup-content-wrapper {
    background: #0f1d15;
    color: white;

    border-radius: 14px;
}

.leaflet-popup-tip {
    background: #0f1d15;
}

.leaflet-popup-content {
    font-family: Inter, Arial, sans-serif;
    font-size: 12px;
}

.spot-icon {
    font-size: 23px;
    text-align: center;
}

/* ---------------- DESKTOP ---------------- */

@media (min-width: 700px) {

    .topbar {
        max-width: 430px;
    }

    .sheet {
        left: 18px;
        right: auto;
        bottom: 18px;

        width: 410px;
        max-height: 76vh;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOPBAR -->

<div class="topbar">

    <div class="logo">
        <span>🍄</span>
        PilzMap
    </div>

    <div class="top-actions">

        <button class="icon-btn"
                id="gpsQuick"
                title="GPS">
            📍
        </button>

        <button class="icon-btn"
                id="sheetToggle"
                title="Menü">
            ☰
        </button>

    </div>

</div>

<button class="map-control" id="layerBtn">
    🛰️ Satellit
</button>


<!-- BOTTOM SHEET -->

<div class="sheet" id="sheet">

    <div class="handle"></div>

    <div class="sheet-header">

        <div>
            <div class="sheet-title">
                🍄 Pilzsuche
            </div>

            <div class="status" id="status">
                Bereit
            </div>
        </div>

        <button class="icon-btn"
                id="collapseBtn">
            ↓
        </button>

    </div>


    <!-- STATISTIK -->

    <div class="dashboard">

        <div class="stat">
            <span class="stat-number" id="spotCount">0</span>
            <span class="stat-label">FUNDE</span>
        </div>

        <div class="stat">

            <span class="stat-label">KM ROUTE</span>
        </div>

        <div class="stat">

        </div>

    </div>


    <!-- SAISON -->

    <div class="season" id="season">
        📅 Saison wird geladen...

    <!-- SUCHE -->

    <div class="search">

            id="locationSearch"
            placeholder="Ort, Wald oder Stadt suchen..."
            autocomplete="off">

        <button
            class="btn green"
            style="width:auto;margin:0"
            id="searchBtn">
            🔎
        </button>

    </div>


    <!-- PILZ AUSWAHL -->

    <select id="mushroomSelect">

        <option value="">
            🍄 Pilzart auswählen
        </option>

        <option value="steinpilz">
            🍄 Steinpilz
        </option>

        <option value="marone">
            🌲 Maronen-Röhrling
        </option>

        <option value="pfifferling">
            🟡 Pfifferling
        </option>

        <option value="birkenpilz">
            🌳 Birkenpilz
        </option>

        <option value="parasol">
            🌾 Parasol
        </option>

        <option value="fliegenpilz">
            🔴 Fliegenpilz
        </option>

    </select>


    <!-- PILZ INFO -->

    <div class="pilz-card" id="mushroomInfo"></div>


    <!-- ACTIONS -->

    <button class="btn blue" id="gpsBtn">
        📍 Meinen Standort anzeigen
    </button>

    <button class="btn orange" id="trackBtn">
        🐾 Route aufzeichnen
    </button>

    <button class="btn purple" id="spotBtn">
        ⭐ Fundort speichern
    </button>

    <button class="btn teal" id="aiBtn">
        📷 Foto analysieren
    </button>


    <div class="row">

        <button class="btn gray" id="exportBtn">
            📤 Export
        </button>

        <button class="btn gray" id="importBtn">
            📥 Import
        </button>

    </div>

    <button class="btn red" id="clearTrackBtn">
        🧹 Route löschen
    </button>


    <!-- SPOTS -->

    <div class="spots">

        <div class="spots-header" id="spotsHeader">

            <span>
                🌲 Meine Fundorte
            </span>

            <span id="spotsArrow">
                ▼
            </span>

        </div>

        <div class="spot-list" id="spotList"></div>

    </div>

</div>


<!-- HIDDEN INPUTS -->

<input
    type="file"
    id="spotImage"
    accept="image/*"
    style="display:none">

<input
    type="file"
    id="aiImage"
    accept="image/*"
    capture="environment"
    style="display:none">

<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none">


<!-- AI MODAL -->

<div class="modal" id="aiModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>📷 Fotoanalyse</h2>

            <span class="close" id="closeAi">
                ×
            </span>

        </div>

        <div class="preview" id="aiPreview"></div>

        <div id="aiResult"
             style="margin-top:10px;font-size:12px;color:#6ee7a0;">
        </div>

        <div class="warning">

            ⚠️ <b>Wichtig:</b>
            Eine Fotoanalyse kann einen Pilz nicht zuverlässig zur
            Verzehrfreigabe bestimmen. Giftige Arten können essbaren
            Arten ähnlich sehen. Im Zweifel niemals essen.

        </div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   PILZMAP 2.0
========================================================= */


/* ---------------- MAP ---------------- */

const osm = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap"
    }
);

const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        attribution: "&copy; Esri"
    }
);

const map = L.map("map", {
    zoomControl: false,
    layers: [osm]
}).setView([53.55, 9.99], 11);

L.control.zoom({
    position: "bottomright"
}).addTo(map);

let satelliteMode = false;

document.getElementById("layerBtn").onclick = () => {

    if (!satelliteMode) {

        map.removeLayer(osm);
        map.addLayer(satellite);

        satelliteMode = true;

        document.getElementById("layerBtn").innerText =
            "🗺️ Karte";

    } else {

        map.removeLayer(satellite);
        map.addLayer(osm);

        satelliteMode = false;

        document.getElementById("layerBtn").innerText =
            "🛰️ Satellit";
    }
};


/* ---------------- UI ---------------- */

const sheet = document.getElementById("sheet");

document.getElementById("sheetToggle").onclick = () => {

    sheet.scrollIntoView({
        behavior: "smooth",
        block: "end"
    });

};

let collapsed = false;

document.getElementById("collapseBtn").onclick = () => {

    collapsed = !collapsed;

    sheet.classList.toggle("collapsed", collapsed);

    document.getElementById("collapseBtn").innerText =
        collapsed ? "↑" : "↓";
};


/* ---------------- SEASON ---------------- */

function updateSeason() {

    const month = new Date().getMonth();

    const names = [
        "Jan","Feb","Mär","Apr","Mai","Jun",
        "Jul","Aug","Sep","Okt","Nov","Dez"
    ];

    document.getElementById("month").innerText =
        names[month];

    let text;

    if (month >= 8 && month <= 10) {

        text =
        "🔥 Hauptsaison: Viele typische Waldpilze können jetzt auftreten.";

    } else if (month >= 5 && month <= 7) {

        text =
        "🌱 Frühsaison: Je nach Wetter sind bereits erste Arten möglich.";

    } else {

        text =
        "❄️ Nebensaison: Weniger klassische Speisepilze, andere Arten können trotzdem vorkommen.";

    }

    document.getElementById("season").innerText =
        "📅 " + text;
}

updateSeason();


/* ---------------- DATA ---------------- */

const MUSHROOMS = {

    steinpilz: {

        name: "Steinpilz",

        trees:
        "Fichte, Buche, Eiche und Kiefer",

        habitat:
        "Misch- und Nadelwälder, häufig bei älteren Bäumen",

        soil:
        "Gut durchlüftete, eher saure bis neutrale Böden",

        season:
        "Sommer bis Herbst",

        warning:
        "Verwechslungsgefahr mit anderen Röhrlingen."

    },

    marone: {

        name: "Maronen-Röhrling",

        trees:
        "Vor allem Fichte und Kiefer",

        habitat:
        "Nadelwälder und Mischwälder",

        soil:
        "Häufig saure Waldböden",

        season:
        "Sommer bis Herbst",

        warning:
        "Nicht nur anhand der Farbe bestimmen."

    },

    pfifferling: {

        name: "Pfifferling",

        trees:
        "Fichte, Kiefer, Buche und Eiche",

        habitat:
        "Moosige, eher lichte Waldstellen",

        soil:
        "Häufig nährstoffarme Böden",

        season:
        "Sommer bis Herbst",

        warning:
        "Verwechslung mit ähnlichen gelben Pilzen möglich."

    },

    birkenpilz: {

        name: "Birkenpilz",

        trees:
        "Vor allem unter Birken",

        habitat:
        "Birkenbestände und Waldränder",

        soil:
        "Feuchte bis mäßig trockene Böden",

        season:
        "Sommer bis Herbst",

        warning:
        "Bestimmung nicht nur über den Standort."

    },

    parasol: {

        name: "Parasol",

        trees:
        "Waldränder, Lichtungen und Wiesen",

        habitat:
        "Offene Grasflächen und Waldränder",

        soil:
        "Humusreiche Böden",

        season:
        "Sommer bis Herbst",

        warning:
        "Ähnliche Arten können giftig sein."

    },

    fliegenpilz: {

        name: "Fliegenpilz",

        trees:
        "Häufig Fichte und Birke",

        habitat:
        "Nadel- und Mischwälder",

        soil:
        "Häufig saure Waldböden",

        season:
        "Sommer bis Herbst",

        warning:
        "Giftig. Nicht verzehren."

    }

};


/* ---------------- MUSHROOM SELECT ---------------- */

const mushroomSelect =
    document.getElementById("mushroomSelect");

mushroomSelect.addEventListener("change", () => {

    const key = mushroomSelect.value;

    if (!key) {

        document.getElementById("mushroomInfo").style.display =
            "none";

        return;
    }

    showMushroom(key);

});


function showMushroom(key) {

    const m = MUSHROOMS[key];

    if (!m) return;

    const box =
        document.getElementById("mushroomInfo");

    box.style.display = "block";

    box.innerHTML = `

        <h3>🍄 ${m.name}</h3>

        <div class="info-line">
            <span class="tag">BÄUME</span>
            ${m.trees}
        </div>

        <div class="info-line">
            <span class="tag">HABITAT</span>
            ${m.habitat}
        </div>

        <div class="info-line">
            <span class="tag">BODEN</span>
            ${m.soil}
        </div>

        <div class="info-line">
            <span class="tag">SAISON</span>
            ${m.season}
        </div>

        <div class="info-line">
            <span class="tag">⚠️</span>
            ${m.warning}
        </div>

        <button
            class="btn green"
            style="margin-top:8px"
            onclick="searchHabitat('${key}')">

            🌲 Waldgebiete auf Karte anzeigen

        </button>
    `;
}


/* ---------------- STATUS ---------------- */

function status(text) {

    document.getElementById("status").innerText =
        text;
}


/* ---------------- GPS ---------------- */

let userMarker = null;
let userCoords = null;

async function getGPS() {

    if (!navigator.geolocation) {

        status("GPS wird von diesem Gerät nicht unterstützt.");

        return;

    }

    status("GPS wird ermittelt...");

    navigator.geolocation.getCurrentPosition(

        position => {

            userCoords = {

                lat: position.coords.latitude,
                lng: position.coords.longitude

            };

            map.flyTo(
                [userCoords.lat, userCoords.lng],
                15,
                {duration: 1.2}
            );

            if (userMarker) {

                map.removeLayer(userMarker);

            }

            userMarker =
                L.marker(
                    [userCoords.lat, userCoords.lng]
                )
                .addTo(map)
                .bindPopup("📍 Dein Standort")
                .openPopup();

            status("GPS-Standort gefunden.");

        },

        error => {

            let message =
                "GPS konnte nicht ermittelt werden.";

            if (error.code === 1)
                message =
                "Standortberechtigung wurde verweigert.";

            if (error.code === 2)
                message =
                "Standort momentan nicht verfügbar.";

            if (error.code === 3)
                message =
                "GPS-Zeitüberschreitung.";

            status(message);

        },

        {

            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 5000

        }

    );

}

document.getElementById("gpsBtn")
    .onclick = getGPS;

document.getElementById("gpsQuick")
    .onclick = getGPS;


/* ---------------- DISTANCE ---------------- */

function distanceKm(a,b) {

    const R = 6371;

    const dLat =
        (b[0]-a[0]) *
        Math.PI / 180;

    const dLng =
        (b[1]-a[1]) *
        Math.PI / 180;

    const x =
        Math.sin(dLat/2) ** 2 +
        Math.cos(a[0]*Math.PI/180) *
        Math.cos(b[0]*Math.PI/180) *
        Math.sin(dLng/2) ** 2;

    return R * 2 *
        Math.atan2(
            Math.sqrt(x),
            Math.sqrt(1-x)
        );

}


/* ---------------- TRACKING ---------------- */

let tracking = false;
let watchId = null;
let track = [];

const trackLine =
    L.polyline(
        [],
        {
            color:"#f97316",
            weight:5,
            opacity:.85
        }
    ).addTo(map);


function updateTrackStats() {

    let total = 0;

    for (
        let i=1;
        i<track.length;
        i++
    ) {

        total +=
            distanceKm(
                track[i-1],
                track[i]
            );

    }

    document.getElementById("distance")
        .innerText =
        total.toFixed(1);

}


document.getElementById("trackBtn")
.onclick = () => {

    if (!tracking) {

        if (!navigator.geolocation) {

            status("GPS nicht verfügbar.");

            return;

        }

        tracking = true;

        track = [];

        trackLine.setLatLngs([]);

        document.getElementById("trackBtn")
            .innerText =
            "🛑 Aufzeichnung stoppen";

        status("Route wird aufgezeichnet...");

        watchId =
            navigator.geolocation.watchPosition(

                position => {

                    const point = [
                        position.coords.latitude,
                        position.coords.longitude
                    ];

                    track.push(point);

                    trackLine.setLatLngs(track);

                    userCoords = {
                        lat: point[0],
                        lng: point[1]
                    };

                    updateTrackStats();

                },

                () => {

                    status(
                        "GPS-Tracking konnte nicht fortgesetzt werden."
                    );

                },

                {
                    enableHighAccuracy:true,
                    maximumAge:2000,
                    timeout:10000
                }

            );

    } else {

        tracking = false;

        if (watchId !== null) {

            navigator.geolocation.clearWatch(
                watchId
            );

        }

        document.getElementById("trackBtn")
            .innerText =
            "🐾 Route aufzeichnen";

        status("Route beendet.");

    }

};


document.getElementById("clearTrackBtn")
.onclick = () => {

    track = [];

    trackLine.setLatLngs([]);

    document.getElementById("distance")
        .innerText = "0.0";

    status("Route gelöscht.");

};


/* ---------------- SAVED SPOTS ---------------- */

const SPOT_KEY =
    "pilzmap_v2_spots";

let spots =
    JSON.parse(
        localStorage.getItem(SPOT_KEY) || "[]"
    );

const spotLayer =
    L.layerGroup().addTo(map);


function saveSpots() {

    localStorage.setItem(
        SPOT_KEY,
        JSON.stringify(spots)
    );

}


function renderSpots() {

    spotLayer.clearLayers();

    const list =
        document.getElementById("spotList");

    list.innerHTML = "";

    document.getElementById("spotCount")
        .innerText = spots.length;

    if (!spots.length) {

        list.innerHTML = `

            <div style="
                padding:10px;
                text-align:center;
                color:#64748b;
                font-size:10px">

                Noch keine Fundorte gespeichert.

            </div>

        `;

        return;

    }


    spots.forEach((spot,index) => {

        const marker =
            L.marker(
                [spot.lat,spot.lng],
                {
                    icon:
                    L.divIcon({
                        className:"spot-icon",
                        html:"🍄",
                        iconSize:[28,28],
                        iconAnchor:[14,14]
                    })
                }
            )
            .addTo(spotLayer);


        const image =
            spot.image
            ?
            `<img src="${spot.image}"
                   style="
                   width:100%;
                   max-height:130px;
                   object-fit:cover;
                   border-radius:8px;
                   margin-top:7px;">`
            :
            "";


        marker.bindPopup(`

            <b>🍄 ${escapeHTML(spot.name)}</b>

            <br>

            <small>
                ${spot.date}
            </small>

            ${
                spot.note
                ?
                `<p>${escapeHTML(spot.note)}</p>`
                :
                ""
            }

            ${image}

            <br><br>

            <button
                onclick="navigateTo(${spot.lat},${spot.lng})">

                🧭 Route starten

            </button>

        `);


        const div =
            document.createElement("div");

        div.className = "spot";

        div.innerHTML = `

            <div class="spot-title">
                🍄 ${escapeHTML(spot.name)}
            </div>

            <div class="spot-sub">
                ${spot.date}
                ${spot.note
                    ? " · " + escapeHTML(spot.note)
                    : ""}
            </div>

            <div class="spot-actions">

                <button
                    class="mini"
                    onclick="showSpot(${index})">
                    📍 Zeigen
                </button>

                <button
                    class="mini"
                    onclick="navigateTo(${spot.lat},${spot.lng})">
                    🧭 Route
                </button>

                <button
                    class="mini"
                    onclick="deleteSpot(${index})">
                    🗑️ Löschen
                </button>

            </div>
        `;

        list.appendChild(div);

    });

}


function escapeHTML(value) {

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


window.showSpot = index => {

    const spot = spots[index];

    map.flyTo(
        [spot.lat,spot.lng],
        16,
        {duration:1}
    );

};


window.navigateTo = (lat,lng) => {

    const url =
        `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

    window.open(
        url,
        "_blank",
        "noopener"
    );

};


window.deleteSpot = index => {

    if (
        !confirm(
            "Diesen Fundort wirklich löschen?"
        )
    ) return;

    spots.splice(index,1);

    saveSpots();

    renderSpots();

    status("Fundort gelöscht.");

};


document.getElementById("spotBtn")
.onclick = () => {

    const center =
        map.getCenter();

    const name =
        prompt(
            "Welche Pilzart oder welcher Name?",
            mushroomSelect.value
                ? MUSHROOMS[mushroomSelect.value].name
                : "Pilzfund"
        );

    if (!name) return;

    const note =
        prompt(
            "Notiz zum Fund:",
            ""
        );

    const addPhoto =
        confirm(
            "Möchtest du ein Foto hinzufügen?"
        );

    if (addPhoto) {

        const input =
            document.getElementById("spotImage");

        input.onchange = event => {

            const file =
                event.target.files[0];

            if (!file) {

                createSpot(
                    name,
                    note,
                    null
                );

                return;

            }

            const reader =
                new FileReader();

            reader.onload =
                e => {

                    createSpot(
                        name,
                        note,
                        e.target.result
                    );

                };

            reader.readAsDataURL(file);

        };

        input.click();

    } else {

        createSpot(
            name,
            note,
            null
        );

    }

};


function createSpot(
    name,
    note,
    image
) {

    spots.push({

        name,
        note,
        image,

        lat:
            map.getCenter().lat,

        lng:
            map.getCenter().lng,

        date:
            new Date()
            .toLocaleString("de-DE")

    });

    saveSpots();

    renderSpots();

    status(
        "🍄 Fundort gespeichert."
    );

}

/* ---------------- IMPORT ---------------- */

};


document.getElementById("importFile")
.onchange = event => {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = e => {

        try {

            const data =
                JSON.parse(
                    e.target.result
                );

            const imported =
                Array.isArray(data)
                ? data
                : data.spots;

            if (!Array.isArray(imported)) {

                throw new Error();

            }

            spots = imported;

            saveSpots();

            renderSpots();

            status(
                "Backup erfolgreich importiert."
            );

        } catch {

            status(
                "Ungültige Backup-Datei."
            );

        }

    };

    reader.readAsText(file);

};


/* ---------------- SEARCH ---------------- */

document.getElementById("searchBtn")
.onclick = searchLocation;

async function searchLocation() {

    const query =
        document.getElementById(
            "locationSearch"
        ).value.trim();

    if (!query) return;

    status("Suche Ort...");

    try {

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({

                    format:"json",
                    q:query,
                    limit:"1",
                    countrycodes:"de"

                })
            );

        const data =
            await response.json();

        if (!data.length) {

            status(
                "Ort nicht gefunden."
            );

            return;

        }

        const lat =
            Number(data[0].lat);

        const lng =
            Number(data[0].lon);

        map.flyTo(
            [lat,lng],
            13,
            {duration:1}
        );

        status(
            "📍 " +
            data[0].display_name
                .split(",")[0]
        );

    } catch {

        status(
            "Fehler bei der Ortssuche."
        );

    }

}


/* ---------------- WEATHER ---------------- */

async function getWeather(
    lat,
    lng
) {

    try {

        const url =
            "https://api.open-meteo.com/v1/forecast?" +
            new URLSearchParams({

                latitude:lat,
                longitude:lng,

                past_days:"7",

                forecast_days:"1",

                daily:
                "precipitation_sum,temperature_2m_mean",

                timezone:"auto"

            });

        const response =
            await fetch(url);

        const data =
            await response.json();

        const rain =
            (data.daily?.precipitation_sum || [])
            .reduce(
                (sum,value) =>
                sum + (value || 0),
                0
            );

        const temps =
            data.daily?.temperature_2m_mean || [];

        const avgTemp =
            temps.length
            ?
            temps.reduce(
                (a,b)=>a+(b||0),
                0
            ) / temps.length
            :
            0;

        return {

            rain:
                Math.round(rain * 10) / 10,

            temp:
                Math.round(avgTemp * 10) / 10

        };

    } catch {

        return null;

    }

}


/* ---------------- HABITAT ---------------- */

let habitatLayer =
    L.layerGroup().addTo(map);


async function searchHabitat(key) {

    const mushroom =
        MUSHROOMS[key];

    if (!mushroom) return;

    status(
        "🌲 Suche Waldgebiete..."
    );

    habitatLayer.clearLayers();

    const bounds =
        map.getBounds();

    const south =
        bounds.getSouth();

    const west =
        bounds.getWest();

    const north =
        bounds.getNorth();

    const east =
        bounds.getEast();


    /*
       Wir verwenden bewusst nur allgemeine
       Waldflächen. OpenStreetMap kann nicht
       zuverlässig sagen, wo eine bestimmte
       Pilzart wächst.
    */

    const query = `

        [out:json][timeout:25];

        (
            way["landuse"="forest"]
            (${south},${west},${north},${east});

            way["natural"="wood"]
            (${south},${west},${north},${east});

        );

        out body;
        >;
        out skel qt;

    `;


    try {

        const response =
            await fetch(
                "https://overpass-api.de/api/interpreter",
                {
                    method:"POST",
                    body:
                        "data=" +
                        encodeURIComponent(query)
                }
            );

        if (!response.ok) {

            throw new Error();

        }

        const data =
            await response.json();

        const geojson =
            convertOSM(data);


        L.geoJSON(
            geojson,
            {

                style: {

                    color:"#34d399",
                    weight:2,
                    fillColor:"#10b981",
                    fillOpacity:.22

                },

                onEachFeature:
                (feature,layer) => {

                    layer.on(
                        "click",
                        async event => {

                            layer.bindPopup(
                                "🌧️ Wetterdaten werden geladen..."
                            ).openPopup(
                                event.latlng
                            );

                            const weather =
                                await getWeather(
                                    event.latlng.lat,
                                    event.latlng.lng
                                );

                            if (!weather) {

                                layer.setPopupContent(
                                    "Wetterdaten momentan nicht verfügbar."
                                );

                                return;

                            }

                            const distance =
                                userCoords
                                ?
                                distanceKm(
                                    [
                                        userCoords.lat,
                                        userCoords.lng
                                    ],
                                    [
                                        event.latlng.lat,
                                        event.latlng.lng
                                    ]
                                ).toFixed(1)
                                :
                                null;


                            layer.setPopupContent(`

                                <b>🌲 Waldgebiet</b>

                                <br><br>

                                💧 Regen letzte 7 Tage:
                                <b>${weather.rain} mm</b>

                                <br>

                                🌡️ Ø Temperatur:
                                <b>${weather.temp} °C</b>

                                ${
                                    distance
                                    ?
                                    `<br><br>
                                     📍 Entfernung:
                                     <b>${distance} km</b>`
                                    :
                                    ""
                                }

                                <br><br>

                                <small>
                                Die Karte zeigt Waldflächen,
                                nicht einen garantierten Pilzfundort.
                                </small>

                            `);

                        }
                    );

                }

            }
        ).addTo(habitatLayer);


        status(
            `${geojson.features.length} Waldflächen gefunden.`
        );

    } catch {

        status(
            "Waldsuche momentan nicht verfügbar."
        );

    }

}


function convertOSM(data) {

    const nodes = {};

    data.elements.forEach(
        element => {

            if (
                element.type === "node"
            ) {

                nodes[element.id] = [
                    element.lon,
                    element.lat
                ];

            }

        }
    );


    const features = [];

    data.elements.forEach(
        element => {

            if (
                element.type === "way" &&
                element.nodes
            ) {

                const coordinates =
                    element.nodes
                    .map(
                        id => nodes[id]
                    )
                    .filter(Boolean);

                if (
                    coordinates.length >= 4
                ) {

                    features.push({

                        type:"Feature",

                        geometry: {

                            type:"Polygon",

                            coordinates:[
                                coordinates
                            ]

                        },

                        properties:
                            element.tags || {}

                    });

                }

            }

        }
    );


    return {

        type:"FeatureCollection",

        features

    };

}
