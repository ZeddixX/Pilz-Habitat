<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilz-Habitat-Finder Ultimate Dark</title>
    
    <!-- PWA Integration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/628/628324.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: #090d16; color: #f1f5f9; overflow: hidden; 
        }
        #map { height: 100vh; width: 100vw; z-index: 1; background: #090d16; }
        
        /* Glassmorphism Dark App Card */
        .app-card { 
            position: absolute; top: 16px; left: 16px; z-index: 1000; 
            width: calc(100% - 32px); max-width: 380px; 
            background: rgba(15, 23, 42, 0.88); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 16px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); max-height: 85vh; overflow-y: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-header { 
            display: flex; align-items: center; justify-content: space-between; 
            cursor: pointer; user-select: none;
        }
        .app-title { font-size: 16px; font-weight: 800; color: #34d399; margin: 0; display: flex; align-items: center; gap: 8px; }
        
        /* Toggle Collapse Button */
        .toggle-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8; width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            transition: background 0.2s, color 0.2s;
        }
        .toggle-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .collapsible-content {
            margin-top: 14px;
            display: flex; flex-direction: column; gap: 10px;
            transition: all 0.3s ease;
        }

        /* Input fields in Dark Mode */
        .search-group { display: flex; gap: 8px; }
        .input-field { 
            flex: 1; padding: 11px 14px; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            background: rgba(30, 41, 59, 0.7); font-size: 13.5px; color: #f8fafc; outline: none; 
            transition: border-color 0.2s;
        }
        .input-field::placeholder { color: #64748b; }
        .input-field:focus { border-color: #34d399; box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2); }
        
        select.input-field { 
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2094a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; 
            padding-right: 36px; font-weight: 600; color: #f1f5f9;
        }
        select.input-field option { background: #0f172a; color: #f1f5f9; }
        
        /* Styling Buttons */
        .btn { 
            border: none; border-radius: 12px; padding: 11px 14px; font-size: 13px; font-weight: 700; 
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; 
            transition: transform 0.1s, background 0.2s; 
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #059669; color: white; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
        .btn-primary:hover { background: #10b981; }
        .btn-gps { width: 100%; background: #0284c7; color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .btn-gps:hover { background: #0369a1; }
        .btn-spot { width: 100%; background: #7c3aed; color: white; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .btn-spot:hover { background: #8b5cf6; }
        .btn-track { width: 100%; background: #ea580c; color: white; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); }
        .btn-track.active { background: #dc2626; animation: pulse 1.5s infinite; }
        
        .btn-group-row { display: flex; gap: 8px; }
        .btn-secondary { flex: 1; background: rgba(255, 255, 255, 0.08); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.12); }
        .btn-clear { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); }
        
        .btn-tile { 
            position: absolute; bottom: 24px; left: 16px; z-index: 1000; 
            background: rgba(15, 23, 42, 0.9); color: #f1f5f9; font-weight: 700; 
            padding: 10px 16px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
        }
        
        /* Dark Info Cards & Badges */
        .info-card { 
            padding: 12px; background: rgba(30, 41, 59, 0.6); 
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); display: none; 
        }
        .info-tag-group { display: flex; flex-direction: column; gap: 8px; }
        .info-tag { font-size: 12px; color: #cbd5e1; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
        .badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; flex-shrink: 0; }
        .badge-tree { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .badge-plant { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .badge-soil { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(203, 213, 225, 0.3); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        
        #status { font-size: 12px; font-weight: 500; color: #94a3b8; }
        
        /* Custom Icons */
        .custom-spot-icon { background: transparent; border: none; font-size: 20px; text-align: center; line-height: 24px; }
        .user-heading-icon { font-size: 24px; transition: transform 0.2s ease; text-shadow: 0 0 10px rgba(52,211,153,0.8); }

        /* Leaflet Popups Dark */
        .leaflet-popup-content-wrapper { 
            background: rgba(15, 23, 42, 0.95) !important; color: #f8fafc !important;
            border-radius: 16px !important; padding: 4px !important; 
            box-shadow: 0 20px 30px rgba(0,0,0,0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
        }
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }
        .weather-popup { padding: 8px 6px; }
        .weather-popup h3 { margin: 0 0 4px 0; font-size: 14px; font-weight: 800; color: #f1f5f9; }
        .weather-popup .mm { font-size: 24px; font-weight: 800; color: #34d399; }
        .weather-popup .detail-row { font-size: 11px; color: #94a3b8; margin-top: 4px; }
        .weather-popup .prognose { font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 8px; display: inline-block; margin-top: 8px; }
        .prognose-niedrig { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        .prognose-mittel  { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .prognose-hoch    { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-card" id="appCard">
    <div class="app-header" id="headerToggle">
        <h1 class="app-title">🌲 Habitat Finder</h1>
        <button class="toggle-btn" id="toggleIcon">▲</button>
    </div>

    <div class="collapsible-content" id="menuContent">
        <!-- Ortssuche -->
        <div class="search-group">
            <input type="text" id="citySearch" class="input-field" placeholder="Ort oder Stadt suchen...">
            <button id="searchBtn" class="btn btn-primary">Suchen</button>
        </div>

        <button id="locBtn" class="btn btn-gps">📍 Standort & Kompass</button>
        <button id="trackBtn" class="btn btn-track">🐾 Route aufzeichnen (GPS)</button>
        <button id="spotBtn" class="btn btn-spot">⭐ Geheimen Fundort speichern</button>

        <div class="btn-group-row">
            <button id="exportBtn" class="btn btn-secondary">📤 Export</button>
            <button id="importBtn" class="btn btn-secondary">📥 Import</button>
            <button id="clearTrackBtn" class="btn btn-secondary btn-clear">🧹 Track löschen</button>
            <input type="file" id="importFile" accept=".json" style="display:none;">
        </div>

        <!-- Pilzauswahl -->
        <select id="pilzSelect" class="input-field" style="width: 100%;">
            <option value="">-- Pilzart auswählen --</option>
            <option value="steinpilz">🍄 Steinpilz</option>
            <option value="marone">🌲 Maronen-Röhrling</option>
            <option value="fliegenpilz">🍄 Fliegenpilz (Zeigerpilz)</option>
            <option value="pfifferling">🟡 Echter Pfifferling</option>
            <option value="birkenpilz">🌳 Birkenpilz</option>
            <option value="parasol">🌾 Parasol-Riesenschirmling</option>
        </select>

        <!-- Habitat-Details -->
        <div id="habitatInfo" class="info-card"></div>
        <div id="status">Suche einen Ort oder wähle eine Pilzart.</div>
    </div>
</div>

<button id="mapToggle" class="btn-tile">🗺️ Satellit</button>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Service Worker Registrierung
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }

    // Einklapp-Funktion für das Menü
    const headerToggle = document.getElementById('headerToggle');
    const menuContent = document.getElementById('menuContent');
    const toggleIcon = document.getElementById('toggleIcon');
    let isCollapsed = false;

    headerToggle.addEventListener('click', () => {
        isCollapsed = !isCollapsed;
        if (isCollapsed) {
            menuContent.style.display = 'none';
            toggleIcon.innerText = '▼';
        } else {
            menuContent.style.display = 'flex';
            toggleIcon.innerText = '▲';
        }
    });

    // Karten-Layer (Standard & Satellit)
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' });
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri World Imagery' });

    const map = L.map('map', { zoomControl: false, layers: [osmLayer] }).setView([53.75, 9.65], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let currentLayer = 'osm';
    document.getElementById('mapToggle').addEventListener('click', () => {
        if (currentLayer === 'osm') {
            map.removeLayer(osmLayer);
            map.addLayer(satLayer);
            currentLayer = 'sat';
            document.getElementById('mapToggle').innerText = '🗺️ Karte';
        } else {
            map.removeLayer(satLayer);
            map.addLayer(osmLayer);
            currentLayer = 'osm';
            document.getElementById('mapToggle').innerText = '🗺️ Satellit';
        }
    });

    let forestLayer = L.layerGroup().addTo(map);
    let spotLayer = L.layerGroup().addTo(map);
    let userMarker = null;
    let userCoords = null;

    // GPS Tracking Vars
    let isTracking = false;
    let watchId = null;
    let trackPath = [];
    let polylineLayer = L.polyline([], { color: '#ea580c', weight: 4, dashArray: '6, 8' }).addTo(map);

    // Habitat-Datenbank
    const HABITAT_DATA = {
        steinpilz: { 
            tag: '["leaf_type"~"needleleaved|broadleaved|mixed"]', 
            baeume: 'Fichten, Buchen, Eichen, Kiefern', 
            zeiger: 'Fliegenpilz, Heidelbeersträucher, Moosteppiche', 
            boden: 'Saurer bis mäßig nährstoffreicher Boden',
            gefahr: '⚠️ Gallenröhrling (bitter, dunkles Röhrennetz)'
        },
        marone: { 
            tag: '["leaf_type"="needleleaved"]', 
            baeume: 'Fichten, Kiefern', 
            zeiger: 'Dichte Moospolster, Sauerklee, Heidelbeeren', 
            boden: 'Saurer Nadelwaldboden',
            gefahr: '⚠️ Gallenröhrling (Röhren laufen rosa an)'
        },
        fliegenpilz: { 
            tag: '["leaf_type"~"needleleaved|mixed"]', 
            baeume: 'Fichten, Birken', 
            zeiger: 'Zeigt verlässlich Steinpilze & Pfifferlinge an!', 
            boden: 'Saurer, feuchter Waldboden',
            gefahr: '⚠️ Giftig! Nur als Zeigerpilz nutzen.'
        },
        pfifferling: { 
            tag: '["leaf_type"~"needleleaved|broadleaved|mixed"]', 
            baeume: 'Fichten, Kiefern, Buchen', 
            zeiger: 'Moosreiche, lichte Stellen, Sauerklee', 
            boden: 'Nährstoffarmer, saurer Sand-/Lehmboden',
            gefahr: '⚠️ Falscher Pfifferling / Ölbaumpilz'
        },
        birkenpilz: { 
            tag: '["leaf_type"~"broadleaved|mixed"]', 
            baeume: 'Ausschließlich Birken (Symbiose)', 
            zeiger: 'Birkenhaine, Grasige Waldränder mit Birken', 
            boden: 'Feuchte, saure Böden',
            gefahr: '⚠️ Ungenießbare/Bittere Röhrlinge'
        },
        parasol: { 
            tag: '', 
            baeume: 'Mischwaldränder, lichte Buchenbestände', 
            zeiger: 'Waldgräser, Brennnesseln, Lichtungen', 
            boden: 'Nährstoff- und humusreicher Boden',
            gefahr: '⚠️ Gift-Riesenschirmling (Verschiebbarer Ring!)'
        }
    };

    // Distanzberechnung in Metern/Kilometern
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const d = R * c;
        return d > 1 ? `${d.toFixed(1)} km` : `${Math.round(d * 1000)} m`;
    }

    // Geheime Fundorte laden & speichern
    function loadSavedSpots() {
        spotLayer.clearLayers();
        const saved = JSON.parse(localStorage.getItem('pilz_spots') || '[]');
        saved.forEach((spot, index) => {
            const marker = L.marker([spot.lat, spot.lng], {
                icon: L.divIcon({
                    className: 'custom-spot-icon',
                    html: '⭐',
                    iconSize: [24, 24]
                })
            }).addTo(spotLayer);

            const shareUrl = `https://maps.google.com/?q=${spot.lat},${spot.lng}`;

            marker.bindPopup(`
                <div style="padding:4px; color:#f8fafc;">
                    <b>⭐ Mein Fundort</b><br>
                    <small style="color:#94a3b8;">${spot.date}</small><br>
                    <div style="display:flex; gap:6px; margin-top:8px;">
                        <button onclick="window.open('${shareUrl}', '_blank')" style="background:rgba(52,211,153,0.2); color:#34d399; border:1px solid rgba(52,211,153,0.3); padding:4px 8px; border-radius:6px; cursor:pointer;">📲 Teilen</button>
                        <button onclick="deleteSpot(${index})" style="background:rgba(239, 68, 68, 0.2); color:#f87171; border:1px solid rgba(248, 113, 113, 0.3); padding:4px 8px; border-radius:6px; cursor:pointer;">Löschen</button>
                    </div>
                </div>
            `);
        });
    }

    document.getElementById('spotBtn').addEventListener('click', () => {
        const center = map.getCenter();
        const saved = JSON.parse(localStorage.getItem('pilz_spots') || '[]');
        saved.push({ lat: center.lat, lng: center.lng, date: new Date().toLocaleDateString('de-DE') });
        localStorage.setItem('pilz_spots', JSON.stringify(saved));
        loadSavedSpots();
        document.getElementById('status').innerText = "Fundort in Kartenmitte gespeichert!";
    });

    window.deleteSpot = function(index) {
        let saved = JSON.parse(localStorage.getItem('pilz_spots') || '[]');
        saved.splice(index, 1);
        localStorage.setItem('pilz_spots', JSON.stringify(saved));
        loadSavedSpots();
    };

    // Export & Import der Fundorte
    document.getElementById('exportBtn').addEventListener('click', () => {
        const saved = localStorage.getItem('pilz_spots') || '[]';
        const blob = new Blob([saved], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `pilz_fundorte_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    });

    document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = JSON.parse(evt.target.result);
                if (Array.isArray(data)) {
                    localStorage.setItem('pilz_spots', JSON.stringify(data));
                    loadSavedSpots();
                    document.getElementById('status').innerText = "Fundorte erfolgreich importiert!";
                }
            } catch {
                document.getElementById('status').innerText = "Ungültige Datei!";
            }
        };
        reader.readAsText(file);
    });

    document.getElementById('clearTrackBtn').addEventListener('click', () => {
        trackPath = [];
        polylineLayer.setLatLngs([]);
        document.getElementById('status').innerText = "GPS-Pfad gelöscht.";
    });

    loadSavedSpots();

    // Städtesuche
    async function searchCity() {
        const query = document.getElementById('citySearch').value.trim();
        const status = document.getElementById('status');
        if (!query) return;
        status.innerText = "Suche Ort...";
        try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
            const res = await fetch(url, { headers: { 'User-Agent': 'PilzHabitatFinder/2.0' } });
            const data = await res.json();
            if (data.length === 0) { status.innerText = "Ort nicht gefunden."; return; }
            map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 12);
            status.innerText = `Ort: ${data[0].display_name.split(',')[0]}`;
            const selectedPilz = document.getElementById('pilzSelect').value;
            if (selectedPilz) triggerPilzFetch(selectedPilz);
        } catch (err) { status.innerText = "Fehler bei Ortssuche."; }
    }

    document.getElementById('searchBtn').addEventListener('click', searchCity);

    // GPS-Ortung + Höhe + Kompass
    document.getElementById('locBtn').addEventListener('click', () => {
        const status = document.getElementById('status');
        if (!navigator.geolocation) { status.innerText = "GPS nicht verfügbar."; return; }
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                map.setView([userCoords.lat, userCoords.lon], 14);
                
                let eleText = '';
                try {
                    const eleRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${userCoords.lat}&longitude=${userCoords.lon}&current=elevation`);
                    const eleData = await eleRes.json();
                    if (eleData.elevation !== undefined) eleText = `<br>Höhe: ~${Math.round(eleData.elevation)}m ü. NHN`;
                } catch {}

                if (userMarker) map.removeLayer(userMarker);
                
                const headingIcon = L.divIcon({
                    className: 'user-heading-icon',
                    html: '<div id="userHeadingArrow">🧭</div>',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                userMarker = L.marker([userCoords.lat, userCoords.lon], { icon: headingIcon }).addTo(map).bindPopup(`<b>Dein Standpunkt</b>${eleText}`).openPopup();
                status.innerText = "Standort lokalisiert. Kompass aktiv!";
                
                // Kompass aktivieren
                if (window.DeviceOrientationEvent) {
                    window.addEventListener('deviceorientation', (e) => {
                        let alpha = e.alpha || e.webkitCompassHeading;
                        if (alpha !== null) {
                            const arrow = document.getElementById('userHeadingArrow');
                            if (arrow) arrow.style.transform = `rotate(${360 - alpha}deg)`;
                        }
                    }, true);
                }

                const selectedPilz = document.getElementById('pilzSelect').value;
                if (selectedPilz) triggerPilzFetch(selectedPilz);
            },
            () => { status.innerText = "GPS-Zugriff verweigert."; }
        );
    });

    // GPS-Track Aufzeichnung
    document.getElementById('trackBtn').addEventListener('click', () => {
        const trackBtn = document.getElementById('trackBtn');
        const status = document.getElementById('status');

        if (!isTracking) {
            if (!navigator.geolocation) { status.innerText = "GPS nicht unterstützt."; return; }
            isTracking = true;
            trackBtn.classList.add('active');
            trackBtn.innerText = "🛑 Aufzeichnung stoppen";
            status.innerText = "Route wird aufgezeichnet...";

            watchId = navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                userCoords = { lat, lon };
                trackPath.push([lat, lon]);
                polylineLayer.setLatLngs(trackPath);
            }, () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });

        } else {
            isTracking = false;
            navigator.geolocation.clearWatch(watchId);
            trackBtn.classList.remove('active');
            trackBtn.innerText = "🐾 Route aufzeichnen (GPS)";
            status.innerText = `Route gespeichert (${trackPath.length} Punkte).`;
        }
    });

    // Wetter- & Bodenfeuchte-Abfrage
    async function fetchWeatherData(lat, lon) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=10&forecast_days=1&daily=precipitation_sum,temperature_2m_mean&timezone=auto`;
        
        const res = await fetch(url);
        if (!res.ok) throw new Error("Wetterdaten konnte nicht geladen werden");
        const data = await res.json();
        
        const sums = data.daily?.precipitation_sum || [];
        const temps = data.daily?.temperature_2m_mean || [];
        
        let rainTotal = 0;
        sums.forEach(val => {
            if (typeof val === 'number' && !isNaN(val)) {
                rainTotal += val;
            }
        });
        rainTotal = Math.round(rainTotal * 10) / 10;

        let tempSum = 0;
        let tempCount = 0;
        temps.forEach(val => {
            if (typeof val === 'number' && !isNaN(val)) {
                tempSum += val;
                tempCount++;
            }
        });
        const tempAvg = tempCount > 0 ? Math.round((tempSum / tempCount) * 10) / 10 : 15;
        
        let elevation = 0;
        try {
            const eleRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=elevation`);
            const eleData = await eleRes.json();
            elevation = Math.round(eleData.elevation || 0);
        } catch {}

        return { rainTotal, tempAvg, elevation };
    }

    function getPrognose(rain, temp) {
        if (rain < 10) return { text: 'Niedrig 🔴 (Geringer Regen)', css: 'prognose-niedrig' };
        if (rain <= 25 && temp >= 12) return { text: 'Mittel 🟡 (Gute Bedingungen)', css: 'prognose-mittel' };
        if (rain > 25 && temp >= 10) return { text: 'Hoch 🟢 (Optimale Feuchte & Wärme!)', css: 'prognose-hoch' };
        return { text: 'Mittel 🟡 (Feucht, aber kühl)', css: 'prognose-mittel' };
    }

    // Walddaten abrufen & Offline-Caching
    function fetchForests(filterTag) {
        const status = document.getElementById('status');
        if (map.getZoom() < 11) { status.innerText = "Bitte näher heranzoomen!"; return; }
        status.innerText = "Lade Habitate...";
        forestLayer.clearLayers();
        const bounds = map.getBounds();
        const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
        const query = `[out:json][timeout:25];(way["landuse"="forest"]${filterTag}(${bbox});relation["landuse"="forest"]${filterTag}(${bbox});way["natural"="wood"]${filterTag}(${bbox});relation["natural"="wood"]${filterTag}(${bbox}););out body;>;out skel qt;`;

        const cacheKey = `cache_${filterTag}_${bbox}`;
        const cachedData = localStorage.getItem(cacheKey);

        fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(query) })
        .then(res => res.json())
        .then(data => {
            localStorage.setItem(cacheKey, JSON.stringify(data));
            renderGeoJson(data);
        })
        .catch(() => {
            if (cachedData) {
                status.innerText = "Offline: Verwende gecachte Walddaten!";
                renderGeoJson(JSON.parse(cachedData));
            } else {
                fetch('https://overpass.kumi.systems/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(query) })
                .then(res => res.json())
                .then(data => renderGeoJson(data))
                .catch(() => status.innerText = "Fehler beim Laden der Waldflächen.");
            }
        });
    }

    function renderGeoJson(data) {
        const status = document.getElementById('status');
        const geojson = osmtogeojson(data);
        if (!geojson.features || geojson.features.length === 0) { status.innerText = "Keine Waldflächen gefunden."; return; }
        
        L.geoJSON(geojson, {
            style: { color: "#34d399", weight: 2, fillColor: "#10b981", fillOpacity: 0.3 },
            onEachFeature: function (feature, layer) {
                layer.on('click', async function (e) {
                    layer.bindPopup('<div style="padding:6px; color:#cbd5e1;">Berechne Habitat-Score…</div>').openPopup(e.latlng);
                    try {
                        const weather = await fetchWeatherData(e.latlng.lat, e.latlng.lng);
                        const prognose = getPrognose(weather.rainTotal, weather.tempAvg);
                        
                        let distText = '';
                        if (userCoords) {
                            const dist = calculateDistance(userCoords.lat, userCoords.lon, e.latlng.lat, e.latlng.lng);
                            distText = `<div class="detail-row">📍 Entfern: <b>${dist} von dir</b></div>`;
                        }

                        layer.setPopupContent(`
                            <div class="weather-popup">
                                <h3>Habitat-Analyse</h3>
                                <div class="mm">${weather.rainTotal} mm <small style="font-size:12px;color:#94a3b8;">(10 Tage)</small></div>
                                <div class="detail-row">🌡️ Ø Temp (10d): <b>${weather.tempAvg} °C</b></div>
                                <div class="detail-row">⛰️ Meereshöhe: <b>~${weather.elevation} m</b></div>
                                ${distText}
                                <div class="prognose ${prognose.css}">${prognose.text}</div>
                            </div>
                        `);
                    } catch { layer.setPopupContent('Fehler bei Datenabfrage.'); }
                });
            }
        }).addTo(forestLayer);
        status.innerText = `${geojson.features.length} Waldflächen identifiziert!`;
    }

    function osmtogeojson(data) {
        let nodes = {};
        data.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lon, el.lat]; });
        let features = [];
        data.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                let coords = el.nodes.map(id => nodes[id]).filter(c => c !== undefined);
                if (coords.length > 3) {
                    if (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1]) coords.push(coords[0]);
                    features.push({ type: "Feature", geometry: { type: "Polygon", coordinates: [coords] }, properties: el.tags || {} });
                }
            }
        });
        return { type: "FeatureCollection", features: features };
    }

    function triggerPilzFetch(val) {
        const infoBox = document.getElementById('habitatInfo');
        if (HABITAT_DATA[val]) {
            const data = HABITAT_DATA[val];
            infoBox.style.display = 'block';
            infoBox.innerHTML = `
                <div class="info-tag-group">
                    <div class="info-tag"><span class="badge badge-tree">Bäume</span> ${data.baeume}</div>
                    <div class="info-tag"><span class="badge badge-plant">Zeiger</span> ${data.zeiger}</div>
                    <div class="info-tag"><span class="badge badge-soil">Boden</span> ${data.boden}</div>
                    <div class="info-tag"><span class="badge badge-danger">Achtung</span> ${data.gefahr}</div>
                </div>
            `;
            fetchForests(data.tag);
        } else {
            infoBox.style.display = 'none';
            forestLayer.clearLayers();
        }
    }

    document.getElementById('pilzSelect').addEventListener('change', (e) => triggerPilzFetch(e.target.value));
</script>
