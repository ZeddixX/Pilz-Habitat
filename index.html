<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilz-Habitat-Finder</title>
    
    <!-- PWA Integration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/628/628324.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', -apple-system, sans-serif; background: #121212; color: #1e293b; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* Glassmorphism Card */
        .app-card { position: absolute; top: 16px; left: 16px; z-index: 1000; width: calc(100% - 32px); max-width: 380px; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 20px; padding: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .app-title { font-size: 16px; font-weight: 700; color: #0f172a; margin: 0; }
        .search-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .input-field { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid #e2e8f0; background: #ffffff; font-size: 13.5px; color: #0f172a; outline: none; }
        .input-field:focus { border-color: #10b981; }
        select.input-field { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2064748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 36px; font-weight: 500; }
        
        /* Buttons */
        .btn { border: none; border-radius: 12px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #10b981; color: white; }
        .btn-gps { width: 100%; background: #0284c7; color: white; margin-bottom: 10px; }
        
        /* Info Cards & Badges */
        .info-card { margin-top: 12px; padding: 12px; background: #ffffff; border-radius: 12px; border: 1px solid #f1f5f9; display: none; }
        .info-tag-group { display: flex; flex-direction: column; gap: 6px; }
        .info-tag { font-size: 12px; color: #334155; display: flex; align-items: flex-start; gap: 6px; }
        .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
        .badge-tree { background: #dcfce7; color: #166534; }
        .badge-plant { background: #fef3c7; color: #92400e; }
        .badge-soil { background: #f1f5f9; color: #475569; }
        #status { margin-top: 10px; font-size: 12px; font-weight: 500; color: #64748b; }
        
        /* Weather Popups */
        .leaflet-popup-content-wrapper { border-radius: 16px !important; padding: 4px !important; }
        .weather-popup { padding: 8px 4px; }
        .weather-popup h3 { margin: 0 0 4px 0; font-size: 14px; font-weight: 700; }
        .weather-popup .mm { font-size: 26px; font-weight: 800; color: #10b981; }
        .weather-popup .prognose { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; display: inline-block; margin-top: 4px; }
        .prognose-niedrig { background: #fee2e2; color: #991b1b; }
        .prognose-mittel  { background: #fef3c7; color: #92400e; }
        .prognose-hoch    { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="app-header">
        <h1 class="app-title">🌲 Habitat Finder</h1>
    </div>

    <!-- Ortssuche -->
    <div class="search-group">
        <input type="text" id="citySearch" class="input-field" placeholder="Ort oder Stadt suchen...">
        <button id="searchBtn" class="btn btn-primary">Suchen</button>
    </div>

    <button id="locBtn" class="btn btn-gps">📍 Standort verwenden</button>

    <!-- Pilzauswahl -->
    <select id="pilzSelect" class="input-field" style="width: 100%;">
        <option value="">-- Pilzart auswählen --</option>
        <option value="steinpilz">🍄 Steinpilz</option>
        <option value="marone">🌲 Maronen-Röhrling</option>
        <option value="fliegenpilz">🍄 Fliegenpilz (Zeigerpilz)</option>
        <option value="pfifferling">🟡 Echter Pfifferling</option>
        <option value="birkenpilz">🌳 Birkenpilz</option>
        <option value="parasol">🌾 Parasol-Riesenschirmling</option>
    </select>

    <!-- Habitat-Details -->
    <div id="habitatInfo" class="info-card"></div>
    <div id="status">Suche einen Ort oder wähle direkt eine Pilzart.</div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Service Worker Registrierung
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }

    // Karte initialisieren
    const map = L.map('map', { zoomControl: false }).setView([53.75, 9.65], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let forestLayer = L.layerGroup().addTo(map);
    let userMarker = null;

    // Habitat-Datenbank
    const HABITAT_DATA = {
        steinpilz: { tag: '["leaf_type"~"needleleaved|broadleaved|mixed"]', baeume: 'Fichten, Buchen, Eichen, Kiefern', zeiger: 'Fliegenpilz, Heidelbeersträucher, Moosteppiche', boden: 'Saurer bis mäßig nährstoffreicher Boden' },
        marone: { tag: '["leaf_type"="needleleaved"]', baeume: 'Fichten, Kiefern', zeiger: 'Dichte Moospolster, Sauerklee, Heidelbeeren', boden: 'Saurer Nadelwaldboden' },
        fliegenpilz: { tag: '["leaf_type"~"needleleaved|mixed"]', baeume: 'Fichten, Birken', zeiger: 'Zeigt verlässlich Steinpilze & Pfifferlinge an!', boden: 'Saurer, feuchter Waldboden' },
        pfifferling: { tag: '["leaf_type"~"needleleaved|broadleaved|mixed"]', baeume: 'Fichten, Kiefern, Buchen', zeiger: 'Moosreiche, lichte Stellen, Sauerklee', boden: 'Nährstoffarmer, saurer Sand-/Lehmboden' },
        birkenpilz: { tag: '["leaf_type"~"broadleaved|mixed"]', baeume: 'Ausschließlich Birken (Symbiose)', zeiger: 'Birkenhaine, Grasige Waldränder mit Birken', boden: 'Feuchte, saure Böden' },
        parasol: { tag: '', baeume: 'Mischwaldränder, lichte Buchenbestände', zeiger: 'Waldgräser, Brennnesseln, Lichtungen', boden: 'Nährstoff- und humusreicher Boden' }
    };

    // Städtesuche
    async function searchCity() {
        const query = document.getElementById('citySearch').value.trim();
        const status = document.getElementById('status');
        if (!query) return;
        status.innerText = "Suche Ort...";
        try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
            const res = await fetch(url, { headers: { 'User-Agent': 'PilzHabitatFinder/2.0' } });
            const data = await res.json();
            if (data.length === 0) { status.innerText = "Ort nicht gefunden."; return; }
            map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 12);
            status.innerText = `Ort: ${data[0].display_name.split(',')[0]}`;
            const selectedPilz = document.getElementById('pilzSelect').value;
            if (selectedPilz) triggerPilzFetch(selectedPilz);
        } catch (err) { status.innerText = "Fehler bei Ortssuche."; }
    }

    document.getElementById('searchBtn').addEventListener('click', searchCity);

    // GPS-Ortung
    document.getElementById('locBtn').addEventListener('click', () => {
        const status = document.getElementById('status');
        if (!navigator.geolocation) { status.innerText = "GPS nicht verfügbar."; return; }
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 13);
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map).bindPopup("<b>Dein Standpunkt</b>").openPopup();
                status.innerText = "Standort lokalisiert.";
                const selectedPilz = document.getElementById('pilzSelect').value;
                if (selectedPilz) triggerPilzFetch(selectedPilz);
            },
            () => { status.innerText = "GPS-Zugriff verweigert."; }
        );
    });

    // Wetter-Abfrage (Open-Meteo)
    async function fetchRainSum(lat, lon) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=10&daily=precipitation_sum&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        const sums = data.daily?.precipitation_sum || [];
        return Math.round((sums.reduce((a, b) => a + (b || 0), 0)) * 10) / 10;
    }

    function getPrognose(mm) {
        if (isNaN(mm) || mm < 10) return { text: 'Niedrig 🔴 (Trocken)', css: 'prognose-niedrig' };
        if (mm <= 25) return { text: 'Mittel 🟡 (Gute Chancen)', css: 'prognose-mittel' };
        return { text: 'Hoch 🟢 (Optimal!)', css: 'prognose-hoch' };
    }

    // Walddaten abrufen
    function fetchForests(filterTag) {
        const status = document.getElementById('status');
        if (map.getZoom() < 11) { status.innerText = "Bitte näher heranzoomen!"; return; }
        status.innerText = "Lade Habitate...";
        forestLayer.clearLayers();
        const bounds = map.getBounds();
        const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
        const query = `[out:json][timeout:25];(way["landuse"="forest"]${filterTag}(${bbox});relation["landuse"="forest"]${filterTag}(${bbox});way["natural"="wood"]${filterTag}(${bbox});relation["natural"="wood"]${filterTag}(${bbox}););out body;>;out skel qt;`;

        fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(query) })
        .then(res => res.json())
        .then(data => renderGeoJson(data))
        .catch(() => status.innerText = "Fehler beim Laden der Waldflächen.");
    }

    function renderGeoJson(data) {
        const status = document.getElementById('status');
        const geojson = osmtogeojson(data);
        if (!geojson.features || geojson.features.length === 0) { status.innerText = "Keine Waldflächen gefunden."; return; }
        L.geoJSON(geojson, {
            style: { color: "#059669", weight: 1.5, fillColor: "#10b981", fillOpacity: 0.35 },
            onEachFeature: function (feature, layer) {
                layer.on('click', async function (e) {
                    layer.bindPopup('<div style="padding:6px;">Messung läuft…</div>').openPopup(e.latlng);
                    try {
                        const mm = await fetchRainSum(e.latlng.lat, e.latlng.lng);
                        const prognose = getPrognose(mm);
                        layer.setPopupContent(`<div class="weather-popup"><h3>Regenmenge (10 Tage)</h3><div class="mm">${mm} mm</div><div class="prognose ${prognose.css}">${prognose.text}</div></div>`);
                    } catch { layer.setPopupContent('Fehler bei Wetterdaten.'); }
                });
            }
        }).addTo(forestLayer);
        status.innerText = `${geojson.features.length} Waldflächen identifiziert!`;
    }

    function osmtogeojson(data) {
        let nodes = {};
        data.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lon, el.lat]; });
        let features = [];
        data.elements.forEach(el => {
            if (el.type === 'way' && el.nodes) {
                let coords = el.nodes.map(id => nodes[id]).filter(c => c !== undefined);
                if (coords.length > 3) {
                    if (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1]) coords.push(coords[0]);
                    features.push({ type: "Feature", geometry: { type: "Polygon", coordinates: [coords] }, properties: el.tags || {} });
                }
            }
        });
        return { type: "FeatureCollection", features: features };
    }

    function triggerPilzFetch(val) {
        const infoBox = document.getElementById('habitatInfo');
        if (HABITAT_DATA[val]) {
            const data = HABITAT_DATA[val];
            infoBox.style.display = 'block';
            infoBox.innerHTML = `<div class="info-tag-group"><div class="info-tag"><span class="badge badge-tree">Bäume</span> ${data.baeume}</div><div class="info-tag"><span class="badge badge-plant">Zeiger</span> ${data.zeiger}</div><div class="info-tag"><span class="badge badge-soil">Boden</span> ${data.boden}</div></div>`;
            fetchForests(data.tag);
        } else {
            infoBox.style.display = 'none';
            forestLayer.clearLayers();
        }
    }

    document.getElementById('pilzSelect').addEventListener('change', (e) => triggerPilzFetch(e.target.value));
</script>

</body>
</html>
