<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Pilzfunde</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen pb-12 font-sans selection:bg-emerald-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-stone-900/90 backdrop-blur-md border-b border-stone-800 px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-900/30">
                    <i class="fa-solid font-bold fa-tree"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide text-stone-100">PilzTracker</h1>
                    <p class="text-xs text-stone-400">Meine Wald- und Fundtagebuch-App</p>
                </div>
            </div>
            <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all text-white px-3.5 py-2 rounded-xl text-sm font-medium flex items-center space-x-2 shadow-md shadow-emerald-900/20">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">Neuer Fund</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 pt-6">

        <!-- Search & Stats Bar -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center mb-6">
            <!-- Search Input -->
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400"></i>
                <input type="text" id="searchInput" oninput="renderGrid()" placeholder="Fund, Ort oder Baumbestand suchen..." 
                       class="w-full bg-stone-800/80 border border-stone-700/60 rounded-xl pl-10 pr-4 py-2.5 text-sm text-stone-100 placeholder-stone-400 focus:outline-none focus:border-emerald-500 transition-colors">
            </div>
            <!-- Counter Badge -->
            <div class="flex items-center justify-between sm:justify-start space-x-2 bg-stone-800/50 border border-stone-800 rounded-xl px-4 py-2 text-xs text-stone-400">
                <span>Gespeicherte Funde:</span>
                <span id="fundCount" class="font-bold text-emerald-400 text-sm">0</span>
            </div>
        </div>

        <!-- Grid Container -->
        <div id="fungiGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Cards generated dynamically -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 px-4">
            <div class="w-20 h-20 mx-auto rounded-full bg-stone-800 flex items-center justify-center text-stone-500 text-3xl mb-4">
                <i class="fa-solid fa-compass"></i>
            </div>
            <h3 class="text-lg font-medium text-stone-300">Keine Funde gefunden</h3>
            <p class="text-stone-500 text-sm mt-1 max-w-sm mx-auto">Es wurden noch keine Einträge gespeichert oder deine Suchanfrage hat keine Treffer erzielt.</p>
            <button onclick="openAddModal()" class="mt-4 inline-flex items-center space-x-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 px-4 py-2 rounded-xl text-sm transition-colors border border-emerald-500/30">
                <i class="fa-solid fa-plus"></i>
                <span>Ersten Fund anlegen</span>
            </button>
        </div>
    </main>

    <!-- Modal: Detail Ansicht -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-stone-900 border border-stone-800 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl relative">
            <button onclick="closeDetailModal()" class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-stone-900/80 text-stone-300 hover:text-white flex items-center justify-center backdrop-blur-md border border-stone-700/50">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div id="detailContent">
                <!-- Dynamic Detail Layout -->
            </div>
        </div>
    </div>

    <!-- Modal: Neuer Fund Hinzufügen -->
    <div id="addModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-stone-900 border border-stone-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center px-5 py-4 border-b border-stone-800">
                <h3 class="font-bold text-stone-100 flex items-center space-x-2">
                    <i class="fa-solid fa-leaf text-emerald-500"></i>
                    <span>Neuen Fund dokumentieren</span>
                </h3>
                <button onclick="closeAddModal()" class="text-stone-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="addFundForm" onsubmit="saveNewFund(event)" class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-400 mb-1">Pilzname / Artenname *</label>
                    <input type="text" id="addName" required placeholder="z.B. Fliegenpilz, Maronenröhrling..." 
                           class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3.5 py-2 text-sm text-stone-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-stone-400 mb-1">Datum *</label>
                        <input type="date" id="addDate" required 
                               class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3.5 py-2 text-sm text-stone-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-400 mb-1">Essbarkeit</label>
                        <select id="addEdibility" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3.5 py-2 text-sm text-stone-100 focus:outline-none focus:border-emerald-500">
                            <option value="Speisepilz">Speisepilz</option>
                            <option value="Ungenießbar">Ungenießbar</option>
                            <option value="Giftig">Giftig / Stark giftig</option>
                            <option value="Unbekannt">Unbekannt / Recherche</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-400 mb-1">Fundort / Waldstück *</label>
                    <input type="text" id="addLocation" required placeholder="z.B. Sachsenwald nahe Eichengruppe" 
                           class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3.5 py-2 text-sm text-stone-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-400 mb-1">Hauptfoto URL (z.B. Unsplash Link)</label>
                    <input type="url" id="addImage" placeholder="https://..." 
                           class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3.5 py-2 text-sm text-stone-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-400 mb-1">Notizen & Merkmale (Lamellen, Stiel, Geruch)</label>
                    <textarea id="addNotes" rows="3" placeholder="Schnittbild-Verfärbung, Nadelwald, Begleitbäume..." 
                              class="w-full bg-stone-800 border border-stone-700 rounded-xl px-3.5 py-2 text-sm text-stone-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t border-stone-800">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-sm text-stone-400 hover:text-stone-200">Abbrechen</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-xl text-sm font-medium transition-colors">
                        Fund Speichern
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Default Sample Data if LocalStorage is empty
        const initialFungiData = [
            {
                id: "fund-1",
                name: "Fliegenpilz (Amanita muscaria)",
                date: "2026-09-15",
                location: "Sachsenwald (Koberg)",
                edibility: "Giftig",
                notes: "Auffällige rote Hutoberfläche mit weißen Flocken. Stand direkt unter einer jungen Birke im Moos. Stielbasis mit charakteristischer Scheide.",
                images: [
                    "https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=800&q=80",
                    "https://images.unsplash.com/photo-1505765050516-f72dcac9c60e?auto=format&fit=crop&w=800&q=80"
                ]
            },
            {
                id: "fund-2",
                name: "Kartoffelbovist (Scleroderma)",
                date: "2026-09-02",
                location: "Lüneburger Heide",
                edibility: "Giftig",
                notes: "Feste, gefelderte gelb-braune Außenschale. Beim Längsschnitt zeigt sich das dunkle, fast schwarze Innenleben (Gleba). Riecht stechend muffig.",
                images: [
                    "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",
                    "https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=800&q=80"
                ]
            },
            {
                id: "fund-3",
                name: "Maronen-Röhrling",
                date: "2026-08-28",
                location: "Forst Klövensteen",
                edibility: "Speisepilz",
                notes: "Schokoladenbrauner Hut. Gelbliche Poren auf der Unterseite verfärben sich bei sanftem Druck leicht bläulich. Fester Stiel.",
                images: [
                    "https://images.unsplash.com/photo-1444858291040-58f756a3bdd6?auto=format&fit=crop&w=800&q=80"
                ]
            }
        ];

        // State Management
        let fungiList = [];

        function initApp() {
            const saved = localStorage.getItem('pilz_funde_db');
            if (saved) {
                fungiList = JSON.parse(saved);
            } else {
                fungiList = initialFungiData;
                saveToLocalStorage();
            }
            // Set default date in modal form to today
            document.getElementById('addDate').value = new Date().toISOString().split('T')[0];
            renderGrid();
        }

        function saveToLocalStorage() {
            localStorage.setItem('pilz_funde_db', JSON.stringify(fungiList));
        }

        function renderGrid() {
            const grid = document.getElementById('fungiGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = fungiList.filter(item => 
                item.name.toLowerCase().includes(searchVal) || 
                item.location.toLowerCase().includes(searchVal) ||
                item.notes.toLowerCase().includes(searchVal)
            );

            document.getElementById('fundCount').innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(item => {
                const edibilityBadge = getEdibilityBadge(item.edibility);
                const defaultImg = item.images && item.images.length > 0 ? item.images[0] : 'https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=800&q=80';

                return `
                    <div class="bg-stone-800/70 border border-stone-800 rounded-2xl overflow-hidden shadow-lg hover:border-stone-700 transition-all group flex flex-col justify-between">
                        <div>
                            <!-- Header Image & Badges -->
                            <div class="relative h-48 overflow-hidden bg-stone-900">
                                <img src="${defaultImg}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                <div class="absolute inset-0 bg-gradient-to-t from-stone-900 via-transparent to-transparent opacity-80"></div>
                                
                                <div class="absolute top-3 left-3">
                                    ${edibilityBadge}
                                </div>

                                <!-- Delete Button -->
                                <button onclick="deleteFund(event, '${item.id}')" title="Fund löschen" 
                                        class="absolute top-3 right-3 w-8 h-8 rounded-xl bg-stone-900/80 hover:bg-red-600 text-stone-300 hover:text-white transition-colors flex items-center justify-center backdrop-blur-sm border border-stone-700/50">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>

                                <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between text-xs text-stone-300">
                                    <span class="flex items-center space-x-1.5 bg-stone-900/70 px-2.5 py-1 rounded-lg backdrop-blur-sm">
                                        <i class="fa-regular fa-calendar text-emerald-400"></i>
                                        <span>${formatDate(item.date)}</span>
                                    </span>
                                    ${item.images.length > 1 ? `<span class="bg-stone-900/70 px-2 py-1 rounded-lg backdrop-blur-sm"><i class="fa-regular fa-images mr-1"></i>${item.images.length}</span>` : ''}
                                </div>
                            </div>

                            <!-- Content -->
                            <div class="p-4">
                                <h3 class="font-bold text-stone-100 text-base group-hover:text-emerald-400 transition-colors line-clamp-1">${item.name}</h3>
                                <p class="text-xs text-stone-400 flex items-center space-x-1 mt-1">
                                    <i class="fa-solid fa-location-dot text-emerald-500"></i>
                                    <span class="truncate">${item.location}</span>
                                </p>
                                <p class="text-stone-300 text-xs mt-3 line-clamp-2 leading-relaxed bg-stone-900/40 p-2 rounded-lg border border-stone-800/50">
                                    ${item.notes || 'Keine detaillierten Merkmale eingetragen.'}
                                </p>
                            </div>
                        </div>

                        <!-- Footer Action -->
                        <div class="px-4 pb-4 pt-1">
                            <button onclick="openDetailModal('${item.id}')" 
                                    class="w-full bg-stone-700/50 hover:bg-emerald-600/20 hover:border-emerald-500/40 border border-stone-700/60 text-stone-200 hover:text-emerald-300 py-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition-all">
                                <span>Details & Blickwinkel</span>
                                <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getEdibilityBadge(type) {
            switch(type) {
                case 'Speisepilz':
                    return `<span class="bg-emerald-500/90 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg backdrop-blur-sm flex items-center space-x-1"><i class="fa-solid fa-utensils"></i><span>Speisepilz</span></span>`;
                case 'Giftig':
                    return `<span class="bg-red-500/90 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg backdrop-blur-sm flex items-center space-x-1"><i class="fa-solid fa-skull-crossbones"></i><span>Giftig</span></span>`;
                case 'Ungenießbar':
                    return `<span class="bg-amber-500/90 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg backdrop-blur-sm flex items-center space-x-1"><i class="fa-solid fa-triangle-exclamation"></i><span>Ungenießbar</span></span>`;
                default:
                    return `<span class="bg-stone-700/90 text-stone-200 text-[10px] font-bold px-2.5 py-1 rounded-lg backdrop-blur-sm flex items-center space-x-1"><i class="fa-solid fa-question"></i><span>Unbekannt</span></span>`;
            }
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            if(parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            return dateStr;
        }

        // Delete Handler
        function deleteFund(event, id) {
            event.stopPropagation();
            if(confirm('Möchtest du diesen Fund wirklich unwiderruflich aus deinem Register löschen?')) {
                fungiList = fungiList.filter(f => f.id !== id);
                saveToLocalStorage();
                renderGrid();
            }
        }

        // Modal Controls
        function openDetailModal(id) {
            const item = fungiList.find(f => f.id === id);
            if(!item) return;

            const container = document.getElementById('detailContent');
            const imagesHtml = (item.images || []).map((img, idx) => `
                <div class="relative rounded-xl overflow-hidden bg-stone-800 border border-stone-700/50">
                    <img src="${img}" alt="Winkel ${idx+1}" class="w-full h-48 object-cover">
                    <span class="absolute bottom-2 left-2 bg-stone-900/80 text-stone-300 text-[10px] px-2 py-0.5 rounded-md backdrop-blur-sm">Perspektive ${idx+1}</span>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="p-6">
                    <div class="flex items-center space-x-2 mb-2">
                        ${getEdibilityBadge(item.edibility)}
                        <span class="text-xs text-stone-400"><i class="fa-regular fa-calendar mr-1"></i>${formatDate(item.date)}</span>
                    </div>
                    <h2 class="text-2xl font-bold text-stone-100 mb-1">${item.name}</h2>
                    <p class="text-sm text-emerald-400 flex items-center space-x-1 mb-6">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>${item.location}</span>
                    </p>

                    <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-3">Dokumentierte Blickwinkel / Fotos</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                        ${imagesHtml || '<p class="text-xs text-stone-500">Keine Fotos vorhanden.</p>'}
                    </div>

                    <div class="bg-stone-800/50 border border-stone-800 rounded-xl p-4 mb-6">
                        <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Schnittbild & Bestimmungsmerkmale</h4>
                        <p class="text-stone-200 text-sm leading-relaxed">${item.notes || 'Keine Merkmale eingetragen.'}</p>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-stone-800">
                        <button onclick="deleteFund(event, '${item.id}'); closeDetailModal();" class="text-red-400 hover:text-red-300 text-xs font-semibold flex items-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>Fund entfernen</span>
                        </button>
                        <button onclick="closeDetailModal()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 px-4 py-2 rounded-xl text-xs font-medium">
                            Schließen
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function saveNewFund(event) {
            event.preventDefault();
            const name = document.getElementById('addName').value;
            const date = document.getElementById('addDate').value;
            const edibility = document.getElementById('addEdibility').value;
            const location = document.getElementById('addLocation').value;
            const imageUrl = document.getElementById('addImage').value;
            const notes = document.getElementById('addNotes').value;

            const newEntry = {
                id: 'fund-' + Date.now(),
                name,
                date,
                edibility,
                location,
                notes,
                images: imageUrl ? [imageUrl] : ["https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=800&q=80"]
            };

            fungiList.unshift(newEntry);
            saveToLocalStorage();
            renderGrid();
            closeAddModal();
            document.getElementById('addFundForm').reset();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
